---
# Resolve which kubeconfig to use for local kubectl/k8s_drain tasks:
# 1. $KUBECONFIG env var (if set)
# 2. ~/.kube/config (if present)
# 3. fallback: {{ playbook_dir }}/rke2.yaml (fetched cluster kubeconfig)
- name: Determine local kubeconfig to use
  connection: local
  delegate_to: localhost
  become: false
  block:
    - name: Stat default kubeconfig
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.kube/config"
      register: default_kube_stat

    - name: Set rke2_local_kubeconfig fact
      ansible.builtin.set_fact:
        rke2_local_kubeconfig: >-
          {{ lookup('env', 'KUBECONFIG')
             if (lookup('env', 'KUBECONFIG') | length > 0)
             else (ansible_env.HOME + '/.kube/config'
                   if default_kube_stat.stat.exists
                   else playbook_dir + '/rke2.yaml') }}
