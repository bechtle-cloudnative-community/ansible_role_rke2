---
# get actual channel version
# The channel server answers with a redirect to the GitHub release tag
# e.g. https://github.com/rancher/rke2/releases/tag/v1.36.5+rke2r1
- name: Get version for channel
  ansible.builtin.uri:
    url: "https://update.rke2.io/v1-release/channels/{{ rke2_channel }}"
    method: GET
    follow_redirects: none
    status_code:
      - 302
      - 503
  register: rke2_channel_redirect

- name: Get installed version from node
  ansible.builtin.command:
    cmd: rke2 --version
  register: rke2_installed_version
  changed_when: false
  failed_when: false

- name: Set version as fact
  ansible.builtin.set_fact:
    rke2_latest_version: "{{ rke2_channel_redirect.location | basename | regex_replace('%2[Bb]', '+') }}"
  when: rke2_channel_redirect.status == 302

- name: Change rke2 installed
  ansible.builtin.set_fact:
    rke2_installed: true
    rke2_current_version: "{{ rke2_installed_version.stdout | regex_search('v[0-9][^ ]*') }}"
  when: rke2_installed_version.rc == 0

# Update only if rke2 is installed, running and older than the channel version
# v1.36.5+rke2r1 is compared as 1.36.5.1
- name: Change update Status
  ansible.builtin.set_fact:
    rke2_update: true
  vars:
    rke2_version_regex: 'v?(\d+)\.(\d+)\.(\d+)[+]rke2r(\d+)'
    rke2_current_cmp: "{{ rke2_current_version | regex_search(rke2_version_regex, '\\1', '\\2', '\\3', '\\4') | default([], true) | join('.') }}"
    rke2_latest_cmp: "{{ rke2_latest_version | default('') | regex_search(rke2_version_regex, '\\1', '\\2', '\\3', '\\4') | default([], true) | join('.') }}"
  when:
    - rke2_check_update
    - rke2_installed
    - rke2_current_cmp | length > 0
    - rke2_latest_cmp | length > 0
    - systemd_svc['rke2-' ~ rke2_type ~ '.service'] is defined
    - systemd_svc['rke2-' ~ rke2_type ~ '.service']['state'] == "running"
    - rke2_current_cmp is version(rke2_latest_cmp, '<')
